# SPDX-License-Identifier: GPL-3.0-or-later
# This file is part of the layer of this Natron fork (see FORK.md at the repository root).
#
# Nuke's default keyboard shortcuts next to Natron's, and what this layer does about each.
#
# Nuke's keys are facts from Foundry's published keyboard shortcut lists (Nuke User Guide, "Keyboard shortcuts");
# Natron's are read from the fork's source (Gui/GuiApplicationManager10.cpp, registerKeybind, and
# Gui/GuiApplicationManager.cpp, the ten plug-ins with a default key). status:
#   same     Natron already does what Nuke does with this key.
#   added    the layer adds it (a menu command under Nuke in the menu bar, with this default key; in Natron's
#            shortcut editor under Global, where the artist can change it). It acts in the node graph only:
#            pressed anywhere else, the key goes on to Natron as if the layer weren't there.
#   differs  Natron uses the key for something else; left as Natron has it (see "natron").
#   missing  no Natron equivalent the layer could add without a core patch.

[[key]]
keys = "B"
where = "node graph"
nuke = "Blur"
natron = "Blur (CImg)"
status = "same"

[[key]]
keys = "C"
where = "node graph"
nuke = "ColorCorrect"
natron = "ColorCorrect"
status = "same"

[[key]]
keys = "D"
where = "node graph"
nuke = "Disable / enable the selected nodes"
natron = "Disable / enable the selected nodes"
status = "same"

[[key]]
keys = "F"
where = "node graph"
nuke = "Fit the selected nodes in the view"
natron = "Frame the selected nodes"
status = "same"

[[key]]
keys = "G"
where = "node graph"
nuke = "Grade"
natron = "Grade"
status = "same"

[[key]]
keys = "I"
where = "node graph"
nuke = "Node information"
natron = "nothing"
status = "added"
menu = "Nuke/Node info"
command = "node_info"

[[key]]
keys = "K"
where = "node graph"
nuke = "Copy"
natron = "nothing in the node graph; K stops playback in the viewer and sets constant interpolation in the curve editor and dope sheet"
