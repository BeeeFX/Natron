# SPDX-License-Identifier: GPL-3.0-or-later
# This file is part of the layer of this Natron fork (see FORK.md at the repository root).
#
# The Nuke look: the values this build gives Natron's preferences while the artist hasn't chosen their own, and the
# skin (icons, font) it draws Natron's interface with.
#
# Each key under [settings] and [habits] is a Natron preference by its script name (Natron's Preferences window
# shows the label; the names are Natron's own, from Engine/Settings.cpp). Colours are [r, g, b] from 0 to 1. A value
# starting with "@layer/" is a file inside the layer.
#
# How it's applied (natron_layer/look.py): at every start, a preference the artist has stored in Natron's settings
# (changed in Natron's Preferences window and saved) is left as it is; the others take the value below for the
# session, without being written anywhere. [settings] is what Natron looks like, [habits] how it behaves: an artist
# who chose Natron's own look (menu bar > Nuke > Look) keeps the habits only. The colours are approximations of
# Nuke's default theme by eye, from Foundry's public pictures (Nuke's exact values aren't published as a list);
# change them here.

[look]
name = "Nuke"

[skin]
# natron_layer/skin.py, set while Natron starts, before its window is built.
# The interface font: DejaVu Sans (Bitstream Vera licence, shipped with its notice in ext/fonts/), a free font
# drawn on Verdana-like proportions, standing in for Nuke's. Not used when the artist chose a font in Natron's
# Preferences.
font = "@layer/ext/fonts/DejaVuSans.ttf"
# Its size in points (Natron's is 11): Nuke's interface font is Verdana at 11 pixels (capitals 8 pixels high on
# Foundry's 1x guide pictures, "Setting Preferences" and "Using the Viewer Controls"), 8.25 points at 96 dpi; 9 points
# (12 pixels) until .sng8. Also the node names' size in the node graph. Not used when the artist chose a size in
# Natron's Preferences.
font_size = 8.25
# Our own icons (ext/icons/, drawn by tools/make_icons.py) instead of Natron's pictures they stand for.
icons = true
# The left toolbar's icons, in pixels at 96 dpi.
toolbar_icon = 20
# The properties pane's share of the window's width in Natron's default layout (Natron gives it 0.35; Nuke's
# properties bin is narrower). A layout the artist made keeps its sizes.
properties_share = 0.30

[settings]
# Appearance > Stylesheet: Natron's own stylesheet with a flat Nuke skin after it (ext/qss/nuke.qss).
stylesheetFile = "@layer/ext/qss/nuke.qss"

# Appearance > Main Window: Nuke's greys and its orange, measured on Foundry's guide pictures (Nuke 17.1 user guide,
# "Nuke Studio Environments", viewer_focus.png): panels and bars 50/255, value fields about 25-33, pane tab strips 33,
# text 200, the orange of a current tab 246, 146, 32.
sunken = [0.11, 0.11, 0.11]
base = [0.196, 0.196, 0.196]
raised = [0.27, 0.27, 0.27]
selection = [0.96, 0.57, 0.125]
text = [0.78, 0.78, 0.78]

# Appearance > Main Window: knob states. Nuke tints an animated value blue (brighter on a keyframe) and an
# expression's value lavender.
interpValue = [0.27, 0.42, 0.62]
keyframe = [0.30, 0.55, 0.88]
exprColor = [0.62, 0.62, 0.92]
# The slider's handle: Nuke's dark khaki (98, 82, 39 on Foundry's "Using the Color Controls" picture).
slider = [0.38, 0.32, 0.15]

# Appearance > Main Window: the timeline, measured on Foundry's timeline pictures ("Using the Viewer Controls",
# viewer_focus.png): outside the frame range 34, inside it the panels' grey; the current frame orange; the in and
# out points red (232, 0, 0); a muted green line on cached frames (66, 98, 72).
timelineBG = [0.133, 0.133, 0.133]
timelinePlayhead = [0.97, 0.58, 0.12]
timelineBound = [0.86, 0.10, 0.08]
cachedFrame = [0.26, 0.38, 0.28]
diskCachedFrame = [0.25, 0.45, 0.25]

# Appearance > Curve Editor and Dope Sheet: dark grey, grey grid and scale instead of Natron's green.
curveEditorBG = [0.13, 0.13, 0.13]
curveditorGrid = [0.30, 0.30, 0.30]
curveeditorScale = [0.55, 0.55, 0.55]
dopesheetBackground = [0.16, 0.16, 0.16]
dopesheetRootSectionBackground = [0.22, 0.22, 0.22]
dopesheetKnobSectionBackground = [0.19, 0.19, 0.19]
dopesheetScale = [0.55, 0.55, 0.55]
dopesheetGrid = [0.30, 0.30, 0.30]

# Appearance > Node Graph: node colours per class, like Nuke's defaults. Round 6 (.sng9) measured them on Foundry's
# guide pictures (a node's colour at a quarter of its height, where Nuke's shading crosses its own colour; Blur's
# 204, 128, 78 checks it, the colour Nuke's Blur panel header shows): Read, Viewer and the others light grey (202),
# Write yellow (193, 193, 0), Grade and ColorCorrect light blue (143, 166, 210), Blur orange (204, 128, 78), Transform
# and Reformat lilac (165, 122, 170), Merge blue (75, 94, 198), Copy and Shuffle plum (158, 61, 99), keyers green
# (42, 209, 42), FrameRange and TimeOffset khaki (178, 165, 94) ("Output (Write) Nodes" write_node.png and
# render_views1.png, "Working with Nodes" nodes01.png and using_dot.png, custom_nodes2.png, "Nuke Studio
# Environments" viewer_focus.png). Until .sng8 the Write was red and the colour nodes green: wrong. Draw (Roto) isn't
# on any picture we found: kept from earlier rounds; the backdrop is Nuke's olive (drawn flat).
#
# Each colour below is Nuke's times 0.793: with nodeShading 1.5 ([drawing]), Natron's shading draws a node 1.45 times
# its colour at the top and 1/1.3 at the bottom, which is then exactly Nuke's gradient (1.15 and 0.61 times its colour,
# measured on the same pictures). A Singerie SNG node takes its class's colour from here too (SNG Read a Read's,
# SNG Write, Cache and Farm a Write's).
usePluginIcons = false
defaultNodeColor = [0.627, 0.627, 0.627]
backdropColor = [0.557, 0.557, 0.22]
readerColor = [0.627, 0.627, 0.627]
writerColor = [0.60, 0.60, 0.0]
generatorColor = [0.627, 0.627, 0.627]
colorNodesColor = [0.445, 0.516, 0.653]
filterNodesColor = [0.634, 0.398, 0.243]
transformNodesColor = [0.513, 0.379, 0.529]
timeNodesColor = [0.553, 0.513, 0.293]
drawNodesColor = [0.349, 0.571, 0.492]
keyerNodesColor = [0.13, 0.65, 0.13]
channelNodesColor = [0.492, 0.19, 0.308]
defaultMergeColor = [0.233, 0.293, 0.616]

[drawing]
# Appearance > Node Graph > Node and link drawing: preferences this fork's own builds add (core patch 0001, every
# default Natron's own drawing; 0003 for errors and selection). Niik-l's plain release has none: there, the node
# graph keeps Natron's drawing. Nuke's node graph by eye: compact tiles (about 80 x 18) with slightly rounded corners
# and a light top-to-bottom shading, a thin dark outline; thin dark links with small, open arrow heads; a selected
# node no halo (nodeSelectedTint above 0; since .sng6 filled with the selection colour, nodeSelectedFill) and its
# links lit; a
# disabled node is crossed out in red; small Dots.
nodeTileWidth = 80
nodeTileHeight = 18
# A node grows to fit a longer label (a Read's file name, ColorCorrect1), as Nuke's do; Natron keeps one width.
nodeFitLabel = true
nodeCornerRadius = 3
# Round 6 (.sng9): Nuke's nodes are shaded strongly, 1.15 times their colour at the top to 0.61 at the bottom
# (Foundry's pictures); 1.5 here with the colours above gives exactly that (0.35, a light shading, until .sng8).
nodeShading = 1.5
nodeOutlineColor = [0.08, 0.08, 0.08]
nodeSelectedColor = [0.99, 0.73, 0.39]
nodeSelectedTint = 0.6
# Nuke's Dot: about 12 pixels across at 100 % ("Working with Nodes" using_dot.png; 11 until .sng8).
dotDiameter = 12
linkWidth = 1.3
linkColor = [0.06, 0.06, 0.06]
linkSelectedColor = [0.99, 0.73, 0.39]
linkArrowLength = 10
linkArrowAngle = 40
disabledCrossColor = [0.86, 0.12, 0.10]
disabledCrossWidth = 2.0
# A node in error turns red with a red outline (Natron's frame and large ERROR don't fit the compact node); its
# message shows when the mouse is over it. A Read whose file is missing says so at once (with postage stamps off,
# nothing else would render it).
nodeErrorTint = 0.7
nodeErrorColor = [0.85, 0.12, 0.10]
# No postage stamp on new Read nodes (Natron shows one by default); the node's Preview box (Node tab) shows it.
readerPreview = false
# Core patch 0005: an input's label (A, B, Mask) beside its link close to the node, and none on a node's only input,
# as Nuke draws them; Viewer nodes with pointed ends (Nuke's Viewer node); backdrops with their label only, large at
# the top left (no name strip).
linkLabelNearInput = true
viewerNodePointed = true
backdropLabelOnly = true
# The small marks on a node's corners (E, P, V) as flat discs instead of Natron's shaded ones.
nodeBadgesFlat = true
# A node whose label has no text keeps its name's size once its panel has been opened (Natron drew it much larger).
nodeNameKeepsSize = true
# Core patch 0004, the properties panels' rows as Nuke's (Foundry's "Properties Panels" picture of a knob row: value,
# slider, colour swatch, colour wheel, the "4" dimensions button, the animation button): the slider's handle a small
# bar over thin ticks, the "4" after the colour buttons, an animation button ending each value's row, and a node's
# first tab named after it (Grade, Blur) instead of "Controls".
sliderHandleBar = true
knobDimensionButtonLast = true
knobAnimationButton = true
pageTabNodeName = true
# Round 4 (.sng5), core patch 0004 too: the timeline's frame ruler as Nuke's (no axis line, short ticks and taller
# numbered ones rising from one baseline, the cached frames' line under them, the in and out points as upright lines,
# the numbers in the regular weight); check boxes with a small cross inside a darker square, and drop-downs shaded
# from light to dark with a dark edge.
timelineRulerCompact = true
knobWidgetsShaded = true
# Round 5 (.sng6), core patches 0007 and 0008, from Foundry's public pictures ("Working with Nodes" nodes_branching_2.png,
# "Nuke Studio Environments" viewer_focus.png, "Animating Parameters" curve_editor_intro.png and dope_sheet_intro.png,
# "Using the Tab Menu"): a selected node filled flat with the selection colour (252, 186, 99 measured; the colour
# above) inside a thin rim of its own colour, its links lit the same colour; the viewer's info bar reading "bbox:"
# and "channels:" in Nuke's order, the values in Nuke's brighter red, green and blue with a white alpha; the r, g, b
# and a curves red, green, blue and white, the dope sheet's keys as narrow grey bars; the Tab search with favourites
# first (a star on each row), a green dot for the nodes made most often, the typed letters in bold. The favourites
# themselves (tabFavourites) are the artist's: the look never sets them.
nodeSelectedFill = true
# Round 6 (.sng9), core patch 0011: a node only as tall as its name needs, so a one-line node is Nuke's 80 x 18 tile
# (Natron left Qt's 4-pixel margin around the name and 20 % more: 28 pixels high at 100 %), and a Merge says its
# operation in words only ("Merge1 (over)"), without Natron's picture of it on the node, as Nuke's.
nodeLabelTight = true
viewerInfoCompact = true
animationEditorsNuke = true
tabSearchFavourites = true

[habits]
# Nodegraph: Nuke's habits. Snap to node and mask inputs hidden until needed (Natron's defaults too, kept here so the
# look says what it relies on); a new Merge takes the selected node in its B input, the trunk, as Nuke's does
# (Natron's default is A: the look turns it off; audit of 11 November 2026, NAT-2).
enableSnapToNode = true
mergeConnectToA = false
autoHideInputs = true

# User Interface: at most 10 properties panels open, as Nuke's properties bin; no file browser when a Write is made
# (Nuke makes the Write and lets you type its file).
maxPanels = 10
writeUseDialog = false

# Project Setup: no postage stamps on new nodes (Nuke shows thumbnails on Read nodes only).
enableAutoPreviewNewProjects = false

[fork_habits]
# Behaviours only this fork's own builds have (core patches; Niik-l's plain release keeps Natron's own, which isn't an
# error). Habits like the table above: they stay when the artist chooses Natron's own look.
# Core patch 0008 (since .sng8): Ctrl+wheel zooms the node graph like the wheel alone, as in Nuke's node graph (Foundry's
# "Navigating Inside the Node Graph": the wheel zooms; nothing resizes a node). Natron's own Ctrl+wheel enlarged the node
# last clicked while Ctrl was held, which artists took for the node changing size.
nodeGraphCtrlWheelZooms = true
