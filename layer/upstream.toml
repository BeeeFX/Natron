# SPDX-License-Identifier: GPL-3.0-or-later
# This file is part of the layer of this Natron fork (see FORK.md at the repository root).
#
# What the layer is built on and tested against. Updated by hand when Niik-l's releases are merged in (see
# layer/README.md, "Bringing Niik-l's releases in") and when the smoke test passes on a release.

[upstream]
# Niik-l's fork of Natron, mirrored unchanged on this repository's RB-2.6 branch.
repository = "https://github.com/Niik-l/Natron"
branch = "RB-2.6"
# The newest of his releases merged into sng/main (the source this branch carries).
tag = "natron-2.6-2026.10.02"
commit = "82d765f04c998b479261f80a40f6eaab00a46245"

[tested]
# The portable release the smoke test (tests/smoke/run_smoke.py) last passed on (Niik-l's portable build, its
# SHA-256 checked against his release page, read only). Singerie's Natron pipeline suite
# (plugins/natron/tests/run_tests.py, 615 checks) passed on it the same day.
release = "natron-2.6-2026.10.02"
commit = "82d765f04c998b479261f80a40f6eaab00a46245"
date = "2026-10-31"
natron = "2.6.0"
python = "3.14.6"
qt_binding = "PySide6 6.11 through qtpy 2.4.3 (both bundled with the release)"
# run_smoke.py --gui (31 October 2026, the second wave): 261 checks with the repository's layer on this release (its
# node graph drawn as Natron's: no drawing preferences), 284 on the .sng3 source build (built from this branch with
# core patches 0001 to 0003, MSYS2 packages of 2026-10-02; Python 3.14.8, PySide6 6.11.2; the window out of sight).
# run_smoke.py --gui --offscreen (1 November 2026, .sng4): 297 checks on the .sng4 source build (core patches 0001 to
# 0005, the window arranged like Nuke's); Singerie's Natron suite (--no-window) passed on it too (407 checks inside).
# run_smoke.py --gui --offscreen (1 November 2026, .sng8): 312 checks on the .sng8 source build (patches 0001 to 0010,
# the Ctrl+wheel checks among them).
# run_smoke.py --gui --offscreen with QT_QPA_PLATFORM=offscreen (8 November 2026, .sng9, the window never on screen):
# 314 of 316 checks on the .sng9 source build (patches 0001 to 0011); the one check left (Natron's own Ctrl+wheel
# magnifier with the preference off) and its summary fail the same way on .sng8 in that mode, and want a visible
# window. Singerie's Natron suite (--no-window, 1,000 checks inside) passed on .sng9.
checks = 261
source_build_checks = 297
# Earlier releases the layer passed on (before the skin, 5 October 2026).
also_passed = ["natron-2.6-2026.09.20"]

[patches]
# Core patches carried on top of Niik-l's code (patches/series). Budget: research, parity-layers.md section 1.2.
# Since .sng3 the builds are made from source (README.md, "Building from source"): the node graph drawing, the
# properties panel header name, errors and selection, and since .sng4 the properties rows and the node graph's Viewer
# nodes, input labels, backdrops and badges, and since .sng5 the timeline's ruler, the sliders' scale, check boxes and
# drop-downs, and since .sng6 the viewer's info bar, the curves' colours, the dope sheet's keys, the selected node and
# the Tab search's favourites (patches/README.md). The budget grew by one patch and 100 lines for .sng5, and by two
# patches and 300 lines for .sng6 (1 November 2026): all are drawn by Natron's C++ code, out of a stylesheet's reach.
# Since .sng7 (patch 0009) a fix of a bug in Niik-l's own code (Shift+1 in the viewer froze it) is carried too: fixes
# count apart from the look's budget (fixes), since one can't wait for a free place (patches/README.md). Since .sng8
# a second (patch 0010: a node enlarged by Natron's Ctrl+wheel magnifier stayed enlarged when Ctrl was let go in another
# panel), and patch 0008 also carries nodeGraphCtrlWheelZooms (Ctrl+wheel zooms the node graph, as Nuke's).
# Since .sng9 (round 6, 8 November 2026) patch 0011, nodeLabelTight: a node as tall as its name needs (Nuke's 80 x 18
# tiles; Natron's text item keeps a margin no stylesheet or Python reaches). The look's budget grew by one patch and
# about 100 lines for it (27 lines used; patches/README.md).
count = 9
fixes = 2
budget_count = 9
budget_lines = 1300

[build]
# How a packaged build is named (tools/package_build.py): 2.6.0+<release date>.sng<n>.
version = "2.6.0+2026.10.02.sng9"
