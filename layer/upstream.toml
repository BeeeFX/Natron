# SPDX-License-Identifier: GPL-3.0-or-later
# This file is part of the layer of this Natron fork (see FORK.md at the repository root).
#
# What the layer is built on and tested against. Updated by hand when Niik-l's releases are merged in (see
# layer/README.md, "Bringing Niik-l's releases in") and when the smoke test passes on a release.

[upstream]
# Niik-l's fork of Natron, mirrored unchanged on this repository's RB-2.6 branch.
repository = "https://github.com/Niik-l/Natron"
branch = "RB-2.6"
# The newest of his releases merged into sng/main (the source this branch carries).
tag = "natron-2.6-2026.10.02"
commit = "82d765f04c998b479261f80a40f6eaab00a46245"

[tested]
# The portable release the smoke test (tests/smoke/run_smoke.py) last passed on (Niik-l's portable build, its
# SHA-256 checked against his release page, read only). Singerie's Natron pipeline suite
# (plugins/natron/tests/run_tests.py, 615 checks) passed on it the same day.
release = "natron-2.6-2026.10.02"
commit = "82d765f04c998b479261f80a40f6eaab00a46245"
date = "2026-10-31"
natron = "2.6.0"
python = "3.14.6"
qt_binding = "PySide6 6.11 through qtpy 2.4.3 (both bundled with the release)"
# run_smoke.py --gui (31 October 2026, the second wave): 261 checks with the repository's layer on this release (its
# node graph drawn as Natron's: no drawing preferences), 279 on the .sng3 source build (built from this branch with
# core patches 0001 and 0002, MSYS2 packages of 2026-10-02; Python 3.14.8, PySide6 6.11.2).
checks = 261
source_build_checks = 279
# Earlier releases the layer passed on (before the skin, 5 October 2026).
also_passed = ["natron-2.6-2026.09.20"]

[patches]
# Core patches carried on top of Niik-l's code (patches/series). Budget: research, parity-layers.md section 1.2.
# Since .sng3 the builds are made from source (README.md, "Building from source"): the node graph drawing and the
# properties panel header name (patches/README.md).
count = 2
budget_count = 5
budget_lines = 800

[build]
# How a packaged build is named (tools/package_build.py): 2.6.0+<release date>.sng<n>.
version = "2.6.0+2026.10.02.sng3"
